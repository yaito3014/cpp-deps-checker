name: cpp-deps-checker
description: Check that a CMake project's target graph and header includes follow its layering rules
inputs:
  source-dir:
    description: CMake source directory, relative to the repository root
    default: .
  cmake-args:
    description: >-
      Extra CMake configure arguments, split on whitespace without quoting.
      The include rules preprocess with the configured compiler, which must
      be Clang.
    default: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
  base-ref:
    description: >-
      Branch whose graph is the baseline for the new-edge list in the job
      summary; empty skips the list. Defaults to the pull request's base
      branch, so the list is empty on push events.
    default: ${{ github.base_ref }}
  artifact-name:
    description: Name of the uploaded artifact holding the graph
    default: cpp-deps-graph
runs:
  using: composite
  steps:
    # The checker is built from the Action's own checkout against LLVM 24,
    # whose development snapshot moves, so a cached build is reused only for
    # the same sources and the same snapshot.
    - name: Find the LLVM 24 snapshot and the checker's sources
      id: versions
      shell: sh
      run: |
        echo "llvm=$("$GITHUB_ACTION_PATH/action/llvm.sh" version)" >>"$GITHUB_OUTPUT"
        echo "sources=$("$GITHUB_ACTION_PATH/action/build.sh" hash "$GITHUB_ACTION_PATH")" >>"$GITHUB_OUTPUT"
    - name: Restore cpp-deps-checker
      id: restore
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ runner.temp }}/cpp-deps-checker-bin
        key: cpp-deps-checker-${{ runner.os }}-${{ steps.versions.outputs.llvm }}-${{ steps.versions.outputs.sources }}
    - name: Install LLVM 24
      shell: sh
      env:
        BUILD: ${{ steps.restore.outputs.cache-hit != 'true' }}
      run: |
        set -- libllvm24 libclang-cpp24 libclang-common-24-dev
        if [ "$BUILD" = true ]; then
          set -- "$@" llvm-24-dev libclang-24-dev libclang-cpp24-dev
        fi
        "$GITHUB_ACTION_PATH/action/llvm.sh" install "$@"
    - name: Build cpp-deps-checker
      if: steps.restore.outputs.cache-hit != 'true'
      shell: sh
      run: |
        "$GITHUB_ACTION_PATH/action/build.sh" build "$GITHUB_ACTION_PATH" \
          "$RUNNER_TEMP/cpp-deps-checker-bin" "$(mktemp -d "$RUNNER_TEMP/cpp-deps-checker-build.XXXXXX")"
    - name: Save cpp-deps-checker
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ runner.temp }}/cpp-deps-checker-bin
        key: ${{ steps.restore.outputs.cache-primary-key }}
    - name: Put cpp-deps-checker on PATH
      shell: sh
      run: echo "$RUNNER_TEMP/cpp-deps-checker-bin" >>"$GITHUB_PATH"
    - name: Check
      id: check
      shell: sh
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
        CMAKE_ARGS: ${{ inputs.cmake-args }}
        BASE_REF: ${{ inputs.base-ref }}
      # A work directory per invocation, so that one job can check several
      # source directories. The status is kept so that the graph is uploaded
      # before the job fails.
      run: |
        work_dir=$(mktemp -d "$RUNNER_TEMP/cpp-deps-checker.XXXXXX")
        echo "work-dir=$work_dir" >>"$GITHUB_OUTPUT"
        WORK_DIR=$work_dir SUMMARY_FILE=$GITHUB_STEP_SUMMARY \
          "$GITHUB_ACTION_PATH/action/run.sh" || echo "status=$?" >>"$GITHUB_OUTPUT"
    - name: Upload graph
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.check.outputs.work-dir }}/graph.md
        if-no-files-found: ignore
    - name: Fail on errors
      if: steps.check.outputs.status != ''
      shell: sh
      env:
        STATUS: ${{ steps.check.outputs.status }}
      run: exit "$STATUS"
