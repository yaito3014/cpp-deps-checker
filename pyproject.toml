[project]
name = "cpp-deps-checker"
version = "0.1.0"
description = "Check that a CMake project's target graph and header includes follow its layering rules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "yaito3014", email = "ykakeyama3014@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
cpp-deps-checker = "cpp_deps_checker.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PT", "ANN", "RUF"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
testpaths = ["tests"]

[tool.importlinter]
root_package = "cpp_deps_checker"

[[tool.importlinter.contracts]]
name = "Modules import only lower layers"
type = "layers"
containers = ["cpp_deps_checker"]
layers = [
    "cli",
    "report",
    "rules",
    "classify | includes",
    "model",
]
