[project]
name = "cpp-deps-checker"
version = "0.1.0"
description = "Check that a CMake project's target graph and header includes follow its layering rules"
readme = "README.md"
authors = [
    { name = "yaito3014", email = "ykakeyama3014@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PT", "ANN", "RUF"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
testpaths = ["tests"]
