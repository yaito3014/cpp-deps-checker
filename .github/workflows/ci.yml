name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uvx --from shellcheck-py shellcheck action/*.sh
      - run: uvx --from actionlint-py actionlint
      - name: Toolchain versions
        run: |
          cmake --version
          clang++ --version
          ninja --version
      - run: uv run pytest
