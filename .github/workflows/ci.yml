name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uvx --from shellcheck-py shellcheck action/*.sh
      - run: uvx --from actionlint-py actionlint
      - name: Toolchain versions
        run: |
          cmake --version
          clang++ --version
          ninja --version
      - run: uv run pytest

  # The Action on a clean fixture and on one with a cycle, each in its own job
  # because both runs would share the Action's work directory.
  action:
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: minimal
            expected: success
          - fixture: cycles_static_pair
            expected: failure
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: ./
        continue-on-error: true
        with:
          source-dir: tests/fixtures/${{ matrix.fixture }}
          artifact-name: graph-${{ matrix.fixture }}
      - name: Expect ${{ matrix.expected }}
        if: steps.check.outcome != matrix.expected
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "::error::the Action ended in $OUTCOME"
          exit 1
