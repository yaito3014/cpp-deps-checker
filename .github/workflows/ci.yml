name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uvx --from shellcheck-py shellcheck action/*.sh
      - run: uvx --from actionlint-py actionlint
      - name: Toolchain versions
        run: |
          cmake --version
          clang++ --version
          ninja --version
      - run: uv run pytest

  # Fails when actions.lock is out of sync with the workflows or a locked pin
  # no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  # The Action on a clean fixture and on one with a cycle, each in its own job
  # because both runs would share the Action's work directory.
  action:
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: minimal
            expected: success
          - fixture: cycles_static_pair
            expected: failure
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - id: check
        uses: $/
        continue-on-error: true
        with:
          source-dir: tests/fixtures/${{ matrix.fixture }}
          artifact-name: graph-${{ matrix.fixture }}
      - name: Expect ${{ matrix.expected }}
        if: steps.check.outcome != matrix.expected
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "::error::the Action ended in $OUTCOME"
          exit 1
