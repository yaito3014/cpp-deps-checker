self-hosted-runner:
  # GitHub-hosted, but unknown to actionlint 1.7.12:
  # https://github.com/rhysd/actionlint/issues/682
  labels:
    - ubuntu-26.04
paths:
  .github/workflows/ci.yml:
    ignore:
      # The lockfile needs the same-repo action as $/, which actionlint 1.7.12
      # does not know: https://github.com/rhysd/actionlint/issues/711
      - 'specifying action "\$/" in invalid format'
